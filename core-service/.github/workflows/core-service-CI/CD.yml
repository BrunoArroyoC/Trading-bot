name: CI/CD core-service

# Trigger when I do git push to main
on:
  push:
    branches:
      - main

# Pipeline
jobs:
  # Each station
  CI:
    runs-on: ubuntu-latest # 1. Corregido el guion (era un guion, no dos puntos)

    # Actions for each station
    steps:
      - name: Checkout code #Get your project
        uses: actions/checkout@v4

      - name: Setup Bun #Install bun
        uses: oven-sh/setup-bun@v2

      - name: CI test #Make the test
        run: bunx vitest
